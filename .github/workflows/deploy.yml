name: Refresh data and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      alert: ${{ steps.enrich.outputs.alert }}
    steps:
      - uses: actions/checkout@v4
      - name: Refresh game data from the submissions Sheet
        id: enrich
        run: python3 scripts/enrich.py
      - name: Commit data changes
        id: commit
        run: |
          if git diff --quiet -- site/data && [ -z "$(git status --porcelain -- site/data)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          git commit -m "Refresh submission data"
          pushed=no
          for i in 1 2 3; do
            if git pull --rebase --quiet origin main && git push --quiet; then pushed=yes; break; fi
            sleep 5
          done
          if [ "$pushed" != yes ]; then echo "Could not push the data commit after 3 tries."; exit 1; fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Stamp asset versions
        if: github.event_name != 'schedule' || steps.commit.outputs.changed == 'true'
        run: sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" site/index.html site/submit.html
      - name: Package site
        if: github.event_name != 'schedule' || steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name != 'schedule' || needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  alert:
    needs: build
    if: needs.build.outputs.alert != ''
    runs-on: ubuntu-latest
    steps:
      - name: Live counts are off
        env:
          MESSAGE: ${{ needs.build.outputs.alert }}
        run: |
          echo "$MESSAGE"
          exit 1
